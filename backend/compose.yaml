services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: money
      POSTGRES_DB: money
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - money-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money -d money"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  money-data:
